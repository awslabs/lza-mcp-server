version: "3.8"

services:
  lza-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: lza-mcp-server
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - FASTMCP_LOG_LEVEL=${FASTMCP_LOG_LEVEL:-INFO}
      - ENABLE_UC_MERGE=${ENABLE_UC_MERGE:-false}
    ports:
      - "8000:8000"
    volumes:
      - ~/.aws:/home/lzauser/.aws:ro
      # Writable tmpfs for runtime operations (config extraction and UC sessions)
      - type: tmpfs
        target: /app/lza-config
        tmpfs:
          size: 200M
    read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
