[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore patterns
norecursedirs = json-schema .git .tox dist build *.egg htmlcov .pytest_cache

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output formatting and coverage
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --cov=awslabs.lza_mcp_server
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    --cov-fail-under=80
    # Performance optimizations
    --maxfail=10
    --disable-warnings

# Test markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (require AWS credentials)
    fastmcp: FastMCP framework integration tests
    aws: Tests that interact with AWS services
    config: Configuration validation tests
    schema: Schema validation and search tests
    pipeline: Pipeline operation tests
    uc_merge: UC merge workflow tests
    property: Property-based tests
    
# Minimum version requirements
minversion = 7.0

# Test timeout (for integration tests)
timeout = 300

# Parallel execution settings
# Use with: pytest -n auto (requires pytest-xdist)
# addopts can include: -n auto

# Warnings configuration
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning:boto3.*
    ignore::DeprecationWarning:botocore.*
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:Exception ignored in.*BaseAgent.run:pytest.PytestUnraisableExceptionWarning
    ignore:coroutine.*was never awaited:RuntimeWarning

# Coverage settings (when using pytest-cov)
[coverage:run]
source = awslabs.lza_mcp_server
branch = true
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */conftest.py
    */.pytest_cache/*
    */htmlcov/*
    */venv/*
    */.venv/*
    */build/*
    */dist/*
    */.tox/*
    */migrations/*
    */node_modules/*
    */__main__.py
    */setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod
    class .*\bProtocol\):
    @overload
    \.\.\.
    pass
    except ImportError:
    except ModuleNotFoundError:
    # pragma: no cover
    # nocov
    if 0:
    if False:
    
show_missing = true
precision = 2
skip_covered = false
skip_empty = false

[coverage:html]
directory = htmlcov
title = LZA MCP Server Coverage Report

[coverage:xml]
output = coverage.xml