# GitLab CI Pipeline for LZA MCP Server
# Based on 'make release' steps with independent job execution

stages:
  - validate
  - quality
  - security
  - test
  - container

# Default configuration for all jobs
default:
  image: python:3.10
  before_script:
    - cd src/lza-mcp-server
    - pip install poetry
    - poetry install

# Cache Poetry dependencies across jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - src/lza-mcp-server/.venv
    - src/lza-mcp-server/.cache/pypoetry

# Clean cache and validate Python syntax
python-syntax-validation:
  stage: validate
  script:
    - echo "🗑️ Cleaning test caches..."
    - make clean-cache
    - echo "🔍 Validating Python syntax..."
    - make py-compile
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - src/lza-mcp-server/*.pyc

# Code formatting check
code-format:
  stage: quality
  script:
    - echo "🎨 Checking code formatting with ruff..."
    - poetry run ruff format --check .
  allow_failure: false

# Code linting
code-lint:
  stage: quality
  script:
    - echo "🔍 Linting code with ruff..."
    - poetry run ruff check .
  artifacts:
    when: on_failure
    expire_in: 1 week
    reports:
      codequality: src/lza-mcp-server/ruff-report.json
  allow_failure: false

# Type checking
type-check:
  stage: quality
  script:
    - echo "🔬 Running type checks with mypy..."
    - poetry run mypy awslabs/ --ignore-missing-imports --no-strict-optional
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - src/lza-mcp-server/.mypy_cache
  allow_failure: false

# Security analysis with Bandit
security-check:
  stage: security
  script:
    - echo "🔒 Running security analysis with bandit..."
    - poetry run bandit -r awslabs/ -f json -o bandit-report.json || true
    - poetry run bandit -r awslabs/ --severity-level medium
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - src/lza-mcp-server/bandit-report.json
    reports:
      sast: src/lza-mcp-server/bandit-report.json
  allow_failure: false

# Dependency vulnerability scan
dependency-audit:
  stage: security
  script:
    - echo "🔒 Running dependency vulnerability scan..."
    - poetry run pip-audit
  artifacts:
    when: on_failure
    expire_in: 1 week
  allow_failure: false

# Test coverage
test-coverage:
  stage: test
  script:
    - echo "📈 Running tests with coverage analysis..."
    - make test-coverage
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - src/lza-mcp-server/htmlcov/
      - src/lza-mcp-server/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/lza-mcp-server/coverage.xml
  allow_failure: false

# Optional: Full release verification (runs all steps sequentially)
release-verification:
  stage: test
  script:
    - echo "🚀 Running complete release verification..."
    - make release
  when: manual
  allow_failure: false

# Build Docker container
build-container:
  stage: container
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_IMAGE_NAME: lza-mcp-server:${CI_COMMIT_SHORT_SHA}
    LZA_MIN_VERSION: v1.12.0
  before_script:
    - docker info
  script:
    - echo "🐳 Building Docker image..."
    - cd src/lza-mcp-server
    - |
      docker build -f Dockerfile \
        --build-arg LZA_MIN_VERSION=${LZA_MIN_VERSION} \
        -t ${DOCKER_IMAGE_NAME} .
    - echo "✅ Docker image built successfully"
    - docker images ${DOCKER_IMAGE_NAME}
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      dotenv: src/lza-mcp-server/build.env
  after_script:
    - echo "DOCKER_IMAGE_NAME=lza-mcp-server:${CI_COMMIT_SHORT_SHA}" > src/lza-mcp-server/build.env

# Scan container for vulnerabilities
scan-container:
  stage: container
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_IMAGE_NAME: lza-mcp-server:${CI_COMMIT_SHORT_SHA}
  needs:
    - build-container
  before_script:
    - apk add --no-cache curl
    - |
      echo "📦 Installing Trivy..."
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - echo "🔍 Scanning container for vulnerabilities with Trivy..."
    - cd src/lza-mcp-server
    - |
      docker build -f Dockerfile \
        --build-arg LZA_MIN_VERSION=v1.12.0 \
        -t ${DOCKER_IMAGE_NAME} .
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-report.json ${DOCKER_IMAGE_NAME}
    - trivy image --severity HIGH,CRITICAL ${DOCKER_IMAGE_NAME}
    - echo "✅ Container scan complete"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - src/lza-mcp-server/trivy-report.json
    reports:
      container_scanning: src/lza-mcp-server/trivy-report.json
  allow_failure: false
