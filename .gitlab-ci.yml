# GitLab CI Pipeline for LZA MCP Server
# Based on 'make release' steps with independent job execution

stages:
  - validate
  - quality
  - security
  - test

# Default configuration for all jobs
default:
  image: public.ecr.aws/docker/library/python:3.11
  before_script:
    - cd src/lza-mcp-server
    - pip install poetry
    - poetry install

# Cache Poetry dependencies across jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - src/lza-mcp-server/.venv
    - src/lza-mcp-server/.cache/pypoetry

# Clean cache and validate Python syntax
python-syntax-validation:
  stage: validate
  script:
    - echo "🗑️ Cleaning test caches..."
    - make clean-cache
    - echo "🔍 Validating Python syntax..."
    - make py-compile
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - src/lza-mcp-server/*.pyc

# Code formatting check
code-format:
  stage: quality
  script:
    - echo "🎨 Checking code formatting with ruff..."
    - poetry run ruff format --check .
  allow_failure: false

# Code linting
code-lint:
  stage: quality
  script:
    - echo "🔍 Linting code with ruff..."
    - poetry run ruff check .
  artifacts:
    when: on_failure
    expire_in: 1 week
    reports:
      codequality: src/lza-mcp-server/ruff-report.json
  allow_failure: false

# Type checking
type-check:
  stage: quality
  script:
    - echo "🔬 Running type checks with mypy..."
    - poetry run mypy awslabs/ --ignore-missing-imports --no-strict-optional
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - src/lza-mcp-server/.mypy_cache
  allow_failure: false

# Security analysis with Bandit
security-check:
  stage: security
  script:
    - echo "🔒 Running security analysis with bandit..."
    - poetry run bandit -r awslabs/ -f json -o bandit-report.json || true
    - poetry run bandit -r awslabs/ --severity-level medium
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - src/lza-mcp-server/bandit-report.json
    reports:
      sast: src/lza-mcp-server/bandit-report.json
  allow_failure: false

# Dependency vulnerability scan
dependency-audit:
  stage: security
  script:
    - echo "🔒 Running dependency vulnerability scan..."
    - poetry run pip-audit --ignore-vuln CVE-2026-4539 # No fix version available yet. Remove --ignore-vuln once pygments releases a patch.
  artifacts:
    when: on_failure
    expire_in: 1 week
  allow_failure: false

# Test coverage
test-coverage:
  stage: test
  script:
    - echo "📈 Running tests with coverage analysis..."
    # Run without parallelization to reduce memory usage in CI
    - |
      poetry run pytest tests/ \
        --cov=awslabs.lza_mcp_server \
        --cov-report=html:htmlcov \
        --cov-report=term-missing \
        --cov-report=xml \
        --cov-branch \
        --cov-fail-under=97 \
        --tb=short
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - src/lza-mcp-server/htmlcov/
      - src/lza-mcp-server/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/lza-mcp-server/coverage.xml
  allow_failure: false
  retry:
    max: 2
    when:
      - runner_system_failure
